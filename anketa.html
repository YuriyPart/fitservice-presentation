<style>
:root{
  --orange:#FE4F01;
  --bg:#F7F7F8;
  --ink:#16181D;
  --card:#FFFFFF;
  --line:#E3E4E8;
  --grey:#8A8F98;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter',Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;min-height:100svh;
}
.disp{font-family:'Oswald','Arial Narrow',Arial,sans-serif;text-transform:uppercase;letter-spacing:.01em}

.progress{position:fixed;top:0;left:0;height:3px;background:var(--orange);width:0%;z-index:60;transition:width .35s ease}
header{
  display:flex;justify-content:space-between;align-items:center;
  padding:18px 28px;font-size:13px;font-weight:700;flex:none;
}
header .mid{font-weight:400;letter-spacing:.12em;color:var(--grey)}
.plus{position:fixed;color:rgba(0,0,0,.28);font-size:15px;z-index:5}
.plus.bl{bottom:14px;left:16px}.plus.br{bottom:14px;right:16px}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 24px 90px}
.step{width:min(760px,100%);display:none;animation:in .45s ease}
.step.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

.qnum{color:#D9DADE;font-family:'Oswald','Arial Narrow',Arial,sans-serif;font-size:clamp(34px,4.6vw,60px);font-weight:500;line-height:1}
.qcount{color:var(--grey);font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;margin:6px 0 14px}
h2{font-family:'Oswald','Arial Narrow',Arial,sans-serif;text-transform:uppercase;font-size:clamp(21px,2.6vw,32px);line-height:1.2;margin-bottom:8px}
.hint{color:var(--grey);font-size:14px;margin-bottom:26px}

input[type=text],input[type=tel],input[type=date],textarea{
  width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;
  color:var(--ink);font-family:'Inter',Arial,sans-serif;font-size:16px;padding:16px 18px;outline:none;
  box-shadow:0 2px 10px rgba(22,24,29,.04);transition:border-color .2s;
}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{border-color:var(--orange)}
input::placeholder,textarea::placeholder{color:#ADB1B8}

.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.chips.small{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.chip{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;font-size:14.5px;font-weight:600;color:#2A2D33;cursor:pointer;
  box-shadow:0 2px 10px rgba(22,24,29,.04);transition:.15s;text-align:left;font-family:'Inter',Arial,sans-serif;
}
.chip:hover{border-color:var(--orange);transform:translateY(-1px)}
.chip.sel{background:var(--orange);border-color:var(--orange);color:#fff}

.nav{display:flex;gap:14px;align-items:center;margin-top:30px;flex-wrap:wrap}
.btn{
  background:var(--orange);color:#fff;border:none;border-radius:12px;cursor:pointer;
  font-family:'Inter',Arial,sans-serif;font-weight:800;text-transform:uppercase;font-size:14.5px;
  letter-spacing:.03em;padding:16px 34px;transition:.2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(254,79,1,.35)}
.btn:disabled{background:#D9DADE;color:#9AA0A8;cursor:not-allowed;transform:none;box-shadow:none}
.ghost{
  background:none;border:1px solid #D9DADE;color:#55585F;border-radius:12px;cursor:pointer;
  font-family:'Inter',Arial,sans-serif;font-weight:700;font-size:14px;padding:15px 24px;transition:.2s;
}
.ghost:hover{border-color:var(--orange);color:var(--ink)}
.enter{color:#ADB1B8;font-size:12.5px}
.err{color:#D8430A;font-size:13px;margin-top:10px;display:none}

/* intro / final */
.intro h1{font-family:'Oswald','Arial Narrow',Arial,sans-serif;text-transform:uppercase;font-size:clamp(30px,4.4vw,56px);line-height:1.08;margin-bottom:14px}
.intro h1 em{font-style:normal;color:var(--orange)}
.intro p{color:#43464D;font-size:16px;line-height:1.6;max-width:36em;margin-bottom:10px}
.intro .meta{color:var(--grey);font-size:13.5px;margin-bottom:30px}
.done{text-align:left}
.done .big{color:var(--orange);font-family:'Oswald','Arial Narrow',Arial,sans-serif;text-transform:uppercase;font-size:clamp(34px,5vw,64px);line-height:1.05;margin-bottom:16px}
.done p{color:#43464D;font-size:16px;line-height:1.6;max-width:34em}
.done .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin-top:26px;font-size:14.5px;color:#55585F;box-shadow:0 2px 10px rgba(22,24,29,.04)}
.done .card b{color:var(--ink)}
.done .mgr-h{font-family:'Oswald','Arial Narrow',Arial,sans-serif;text-transform:uppercase;font-size:17px;letter-spacing:.04em;margin:30px 0 14px}
.mgrs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mgr{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 2px 10px rgba(22,24,29,.04)}
.mgr .reg{color:var(--orange);font-weight:800;font-size:10.5px;text-transform:uppercase;line-height:1.35;margin-bottom:6px}
.mgr .nm{font-weight:800;font-size:15px;margin-bottom:8px}
.mgr a{display:block;color:#43464D;text-decoration:none;font-size:13px;line-height:1.6;word-break:break-all}
.mgr a:hover{color:var(--orange)}
.mgr a.tel{font-weight:800;color:var(--ink);font-size:14px}
@media (max-width:560px){ .mgrs{grid-template-columns:1fr} }

@media (max-width:560px){
  header{padding:14px 18px;font-size:11px}
  main{padding:12px 18px 70px}
  .chips,.chips.small{grid-template-columns:1fr 1fr}
  .chip{padding:12px 12px;font-size:13px}
  .nav .btn{flex:1;text-align:center}
}
@media (max-width:400px){
  .chips,.chips.small{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="progress" id="progress"></div>
<header>
  <span>АНКЕТА ПАРТНЁРА</span>
  <span class="mid">ФРАНШИЗА</span>
  <span>FIT SERVICE</span>
</header>
<span class="plus bl">+</span><span class="plus br">+</span>

<main><div id="app"></div></main>

<script>
/* ================= НАСТРОЙКА =================
   METRIKA_ID — номер счётчика Яндекс.Метрики (тот же, что на сайте-презентации).
   SUBMIT_URL — endpoint, куда POST-ом уходит JSON с ответами
                (webhook CRM / Google Apps Script / бот). Пока пусто —
                ответы дублируются в консоль, а пользователю показывается
                экран «Спасибо». Программисту: см. функцию submitForm().
   Цели Метрики: anketa_open, anketa_start, anketa_q_N, anketa_submit.
=============================================== */
var METRIKA_ID = 'XXXXXXXX';
var SUBMIT_URL = '';

(function(m,e,t,r,i,k,a){
  if(!/^\d+$/.test(String(METRIKA_ID))) return;
  m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
  m[i].l=1*new Date();
  k=e.createElement(t),a=e.getElementsByTagName(t)[0];
  k.async=1;k.src=r;a.parentNode.insertBefore(k,a);
})(window,document,'script','https://mc.yandex.ru/metrika/tag.js','ym');
if(/^\d+$/.test(String(METRIKA_ID))){
  ym(METRIKA_ID,'init',{clickmap:true,trackLinks:true,accurateTrackBounce:true,webvisor:true});
}
function track(goal,params){
  try{
    if(typeof ym==='function' && /^\d+$/.test(String(METRIKA_ID))) ym(METRIKA_ID,'reachGoal',goal,params||{});
    if(window.console) console.debug('[goal]',goal,params||'');
  }catch(e){}
}
track('anketa_open');

/* ================= ВОПРОСЫ ================= */
var SOURCES = ['Авито','Активный поиск в интернете','ВКонтакте','ДОД','Посоветовали','Выставки','Клиент ФитСервиса','Росско','Посоветовали Франчайзи','Агрегаторы франшиз','Яндекс','Email рассылка','Google','Instagram','WA','Действующий клиент'];

var Q = [
  {id:'fio',     type:'text',   title:'Как вас зовут?', hint:'фамилия, имя и отчество', ph:'Иванов Иван Иванович', required:true},
  {id:'phone',   type:'tel',    title:'Телефон для связи', hint:'сюда менеджер позвонит или напишет по итогам анкеты', ph:'+7 (___) ___-__-__', required:true},
  {id:'source',  type:'chips',  title:'Откуда узнали о франшизе?', options:SOURCES, small:true, required:true},
  {id:'why_auto',type:'area',   title:'Почему выбрали сферу автосервиса?', ph:'Расскажите своими словами…', required:true},
  {id:'business',type:'chips',  title:'Имеется или имелся свой бизнес?', options:['Есть бизнес','Нет бизнеса','Был бизнес','Действующий клиент'], required:true},
  {id:'biz_dir', type:'area',   title:'Какое направление бизнеса?', ph:'Например: розничная торговля, грузоперевозки…', required:true, showIf:function(a){return a.business==='Есть бизнес'||a.business==='Был бизнес';}},
  {id:'why_fr',  type:'area',   title:'Почему решили развиваться по франшизе?', ph:'Что для вас главное в этой модели…', required:true},
  {id:'manager', type:'area',   title:'Кто будет управлять станцией?', ph:'Сами, управляющий, партнёр…', required:true},
  {id:'income',  type:'text',   title:'Какой ежемесячный доход ожидаете?', ph:'Например: 300 000 ₽', required:true},
  {id:'benefits',type:'area',   title:'Назовите 3 главных преимущества франшизы FIT SERVICE для вас', ph:'1. …\n2. …\n3. …', required:true},
  {id:'visited', type:'chips',  title:'Удалось ли посетить одну из станций FIT SERVICE?', options:['Да','Нет','Действующий клиент'], required:true},
  {id:'invest',  type:'text',   title:'На какую сумму инвестиций рассчитываете?', ph:'Например: 10–12 млн ₽', required:true},
  {id:'edu',     type:'chips',  title:'Готовы ли пройти обучение сами?', options:['Да','Нет','Действующий клиент'], required:true},
  {id:'promo',   type:'chips',  title:'Готовы ли делать локальную рекламу?', options:['Да','Нет','Действующий клиент'], required:true},
];

/* ================= ДВИЖОК ================= */
var app = document.getElementById('app');
var progress = document.getElementById('progress');
var answers = {};
var cur = -1; // -1 = интро
var started = false;

function visibleSteps(){
  return Q.filter(function(q){ return !q.showIf || q.showIf(answers); });
}
function esc(t){ var d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

function render(){
  var steps = visibleSteps();
  if(cur === -1){
    progress.style.width = '0%';
    app.innerHTML =
      '<div class="step on intro">'+
      '<h1>Будьте на шаг <em>впереди</em></h1>'+
      '<p>Заполните анкету партнёра — менеджер подготовится к разговору заранее и предложит <b>персональные условия именно под вас</b>. Встреча сразу станет предметной.</p>'+
      '<p class="meta">' + steps.length + ' коротких вопросов · займёт 3–5 минут</p>'+
      '<div class="nav"><button class="btn" onclick="start()">Заполнить анкету</button></div>'+
      '</div>';
    return;
  }
  if(cur >= steps.length){ renderDone(); return; }
  var q = steps[cur];
  progress.style.width = ((cur)/steps.length*100) + '%';
  track('anketa_q_' + (cur+1));

  var control = '';
  var val = answers[q.id] || '';
  if(q.type==='text' || q.type==='tel'){
    control = '<input type="'+q.type+'" id="inp" value="'+esc(val)+'" placeholder="'+(q.ph||'')+'" autocomplete="off">';
  } else if(q.type==='area'){
    control = '<textarea id="inp" placeholder="'+(q.ph||'')+'">'+esc(val)+'</textarea>';
  } else if(q.type==='chips'){
    control = '<div class="chips'+(q.small?' small':'')+'">' + q.options.map(function(o){
      return '<button type="button" class="chip'+(val===o?' sel':'')+'" data-v="'+esc(o)+'">'+esc(o)+'</button>';
    }).join('') + '</div>';
  }

  app.innerHTML =
    '<div class="step on">'+
    '<div class="qnum">'+String(cur+1).padStart(2,'0')+'</div>'+
    '<div class="qcount">Вопрос '+(cur+1)+' из '+steps.length+'</div>'+
    '<h2>'+q.title+'</h2>'+
    (q.hint?'<div class="hint">'+q.hint+'</div>':'<div class="hint"></div>')+
    control+
    '<div class="err" id="err">Пожалуйста, ответьте на вопрос — без этого менеджер не сможет подготовиться</div>'+
    '<div class="nav">'+
      (cur>0||true?'<button class="ghost" onclick="prev()">← Назад</button>':'')+
      '<button class="btn" onclick="next()">'+(cur===steps.length-1?'Отправить анкету':'Далее →')+'</button>'+
      (q.type!=='area'?'<span class="enter">или нажмите Enter</span>':'')+
    '</div>'+
    '</div>';

  var inp = document.getElementById('inp');
  if(inp){
    inp.focus();
    if(q.id==='phone'){
      inp.setAttribute('inputmode','tel');
      inp.setAttribute('maxlength','18');
      if(val) inp.value = maskPhone(val);
      inp.addEventListener('input', function(){
        inp.value = maskPhone(inp.value);
        answers[q.id] = inp.value;
      });
    } else {
      inp.addEventListener('input', function(){ answers[q.id]=inp.value.trim(); });
    }
    if(q.type!=='area'){
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); next(); } });
    }
  }
  [].slice.call(app.querySelectorAll('.chip')).forEach(function(c){
    c.addEventListener('click', function(){
      answers[q.id] = c.getAttribute('data-v');
      [].slice.call(app.querySelectorAll('.chip')).forEach(function(x){ x.classList.remove('sel'); });
      c.classList.add('sel');
      setTimeout(next, 180);
    });
  });
}

function phoneDigits(v){
  var d = String(v||'').replace(/\D/g,'');
  if(d.charAt(0)==='8') d = '7' + d.slice(1);
  if(d.charAt(0)==='9') d = '7' + d;
  if(d && d.charAt(0)!=='7') d = '7' + d;
  return d.slice(0,11);
}
function maskPhone(v){
  var d = phoneDigits(v);
  if(!d) return '';
  var out = '+7';
  if(d.length>1) out += ' (' + d.slice(1,4);
  if(d.length>=4) out += ')';
  if(d.length>4) out += ' ' + d.slice(4,7);
  if(d.length>7) out += '-' + d.slice(7,9);
  if(d.length>9) out += '-' + d.slice(9,11);
  return out;
}

function start(){
  cur = 0;
  if(!started){ started=true; track('anketa_start'); }
  render();
}
function prev(){
  if(cur<=0){ cur=-1; } else { cur--; }
  render();
}
function next(){
  var steps = visibleSteps();
  var q = steps[cur];
  var v = answers[q.id];
  var err = document.getElementById('err');
  if(q.required && (!v || !String(v).trim())){
    err.style.display='block';
    return;
  }
  if(q.id==='phone' && phoneDigits(v).length !== 11){
    err.textContent = 'Введите номер полностью — например, +7 (912) 345-67-89';
    err.style.display='block';
    return;
  }
  if(cur === steps.length-1){ submitForm(); return; }
  cur++;
  render();
}

function submitForm(){
  var steps = visibleSteps();
  var payload = { form:'anketa-partnera-fitservice', submitted_at:new Date().toISOString(), answers:{} };
  var d = new Date();
  payload.answers['Дата заполнения'] = String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();
  steps.forEach(function(q){ payload.answers[q.title] = answers[q.id] || ''; });
  payload.phone = '+' + phoneDigits(answers.phone);   // нормализованный номер для сопоставления в CRM: +7XXXXXXXXXX
  payload.answers['Телефон для связи'] = maskPhone(answers.phone);
  track('anketa_submit');
  console.log('ANKETA PAYLOAD', JSON.stringify(payload, null, 2));
  if(SUBMIT_URL){
    fetch(SUBMIT_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)})
      .catch(function(e){ console.error('submit error', e); });
  }
  cur = steps.length;
  renderDone();
}

function renderDone(){
  progress.style.width='100%';
  app.innerHTML =
    '<div class="step on done">'+
    '<div class="big">Спасибо!<br>Анкета отправлена</div>'+
    '<p>Менеджер отдела развития изучит ваши ответы, персонально подготовится к встрече и предложит условия сотрудничества именно под вас. Свяжемся с вами в ближайшее время.</p>'+
    '<div class="mgr-h">Хотите быстрее? Свяжитесь с менеджером вашего региона</div>'+
    '<div class="mgrs">'+
      '<div class="mgr"><div class="reg">Регионы РФ: Москва и М.О., ДВФО</div><div class="nm">Павел Коровин</div>'+
        '<a class="tel" href="tel:+79618717044">+7 961 871-70-44</a>'+
        '<a href="mailto:korovin.p.n@rossko.ru">korovin.p.n@rossko.ru</a></div>'+
      '<div class="mgr"><div class="reg">Регионы РФ: ПФО, СЗФО, ЮФО</div><div class="nm">Алексей Казачкин</div>'+
        '<a class="tel" href="tel:+79628368402">+7 962 836-84-02</a>'+
        '<a href="mailto:a.kazachkin@fitauto.ru">a.kazachkin@fitauto.ru</a></div>'+
      '<div class="mgr"><div class="reg">Регионы РФ: СФО, ЦФО, СКФО, УФО</div><div class="nm">Юрий Партала</div>'+
        '<a class="tel" href="tel:+79618717047">+7 961 871-70-47</a>'+
        '<a href="mailto:partala.y.a@fitauto.ru">partala.y.a@fitauto.ru</a>'+
        '<a href="https://t.me/fitmng" target="_blank" rel="noopener">t.me/fitmng</a></div>'+
      '<div class="mgr"><div class="reg">Республика Казахстан</div><div class="nm">Елназ Бегалы</div>'+
        '<a class="tel" href="tel:+77474387929">+7 747 438-79-29</a>'+
        '<a href="mailto:begaly.e.e@fitauto.ru">begaly.e.e@fitauto.ru</a></div>'+
    '</div>'+
    '</div>';
  [].slice.call(app.querySelectorAll('.mgr a')).forEach(function(a){
    a.addEventListener('click', function(){ track('contact_click', {page:'anketa'}); });
  });
}

render();
</script>
</body>
</html>
